steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Use Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install dependencies
    run: npm ci

  - name: Build (set GH_PAGES to ensure correct base)
    env:
      GH_PAGES: true
    run: npm run build

  - name: Run postbuild (create 404 fallback)
    run: sh scripts/postbuild.sh || true

  - name: Debug: list dist
    run: |
      echo "=== dist listing ==="
      ls -la dist || true
      echo "\n=== Recursive listing ==="
      ls -R dist || true

  - name: Debug: show index.html head
    run: |
      echo "=== index.html (first 200 lines) ==="
      head -n 200 dist/index.html || true

  - name: Debug: show 404.html head
    run: |
      echo "=== 404.html (first 200 lines) ==="
      head -n 200 dist/404.html || true

  - name: Debug: show a few asset names
    run: |
      echo "=== assets top-level ==="
      ls -la dist/assets || true

  - name: Upload dist as artifact
    if: ${{ always() }}
    uses: actions/upload-artifact@v4
    with:
      name: debug-pages-dist
      path: dist