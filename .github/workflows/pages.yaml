steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install dependencies
    run: npm ci

  - name: Build (set GH_PAGES to ensure correct base)
    env:
      GH_PAGES: true
    run: npm run build

  - name: SPA fallback: copy index to 404
    run: sh scripts/postbuild.sh || true

  - name: Debug: list dist (optional)
    run: |
      echo "=== dist listing ==="
      ls -la dist || true
      echo ""
      echo "=== Recursive listing ==="
      ls -R dist || true

  - name: Upload pages artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: ./dist

  - name: Deploy to GitHub Pages
    uses: actions/deploy-pages@v5