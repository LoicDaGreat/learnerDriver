name: GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (set GH_PAGES to ensure correct base)
        env:
          GH_PAGES: true
        run: npm run build

      - name: "SPA fallback: copy index to 404"
        run: |
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: "Debug: list dist (optional)"
        run: |
          echo "=== dist listing ==="
          ls -la dist || true
          echo ""
          echo "=== dist recursive listing ==="
          ls -R dist || true

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
