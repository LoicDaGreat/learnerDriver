name: Pages - Debug Build
on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: "Build (set GH_PAGES to ensure correct base)"
        env:
          GH_PAGES: true
        run: npm run build

      - name: "SPA fallback: copy index to 404"
        run: sh scripts/postbuild.sh || true

      - name: "Debug: list dist"
        run: |
          echo "=== dist top-level listing ==="
          ls -la dist || true
          echo ""
          echo "=== dist recursive listing ==="
          ls -R dist || true

      - name: "Debug: show index.html head"
        run: |
          echo "=== index.html (first 200 lines) ==="
          head -n 200 dist/index.html || true

      - name: "Debug: show 404.html head"
        run: |
          echo "=== 404.html (first 200 lines) ==="
          head -n 200 dist/404.html || true

      - name: "Debug: show assets top-level"
        run: |
          echo "=== dist/assets listing ==="
          ls -la dist/assets || true

      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages-dist
          path: ./dist
